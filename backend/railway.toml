# Force Railpack (not legacy Nixpacks). Nixpacks defaults to Node 18 and
# may not honor Node 24 the way Railpack does.
# Railway config-as-code often resolves from this path relative to the
# service Root Directory (/backend).
[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run railway:start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
