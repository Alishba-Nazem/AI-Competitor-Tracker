# Railway config-as-code defaults to /railway.toml at the repo root
# (does not automatically use /backend/railway.toml).
# Root Directory should still be set to "backend" in the Railway service.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run railway:start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
