# Railway config-as-code defaults to /railway.toml at the repo root.
# Root Directory should still be set to "backend" in the Railway service.
#
# IMPORTANT: Do NOT run prisma db push in startCommand. That blocks binding
# to PORT, Railway healthchecks fail, and the container gets SIGTERM.
[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "npm run railway:predeploy"
startCommand = "npm run railway:start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
